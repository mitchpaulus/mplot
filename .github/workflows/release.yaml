name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        name: Checkout Repo

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Download ANTLR
        run: curl --output antlr-4.11.1-complete.jar https://www.antlr.org/download/antlr-4.11.1-complete.jar

      - name: Compile ANTLR grammars
        run: |
          export ANTLR_JAR="$(pwd)"/antlr-4.11.1-complete.jar
          export CLASSPATH=.:"$(pwd)/antlr-4.11.1-complete.jar"
          cd MplotLib/antlr/
          ./compile_grammer

      - name: Build
        run: dotnet build

      - name: Publish
        run: |
          dotnet publish -r linux-x64 --self-contained -o publish-linux-x64 -c Release -p:DebugType=None -p:PublishSingleFile=true MplotCli/MplotCli.csproj

      - name: GH Release
        uses: softprops/action-gh-release@v0.1.14
        with:
          fail_on_unmatched_files: true
          files: |
            publish-linux-x64/mplot
